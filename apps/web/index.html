<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rbox dashboard</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --border: #272b34;
        --text: #e6e8ec;
        --muted: #9aa0aa;
        --accent: #5b8cff;
        --accent-hover: #6f9bff;
        --danger: #ff6b6b;
        --ok: #3ecf8e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
      .hidden { display: none !important; }
      .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
      .row:last-child { border-bottom: none; }
      .row .k { color: var(--muted); }
      .row .v { font-weight: 600; text-align: right; word-break: break-all; }
      .bar { height: 8px; background: #0b0d11; border-radius: 6px; overflow: hidden; margin: 6px 0 16px; }
      .bar > span { display: block; height: 100%; background: var(--accent); width: 0%; transition: width .3s ease; }
      .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 20px 0 8px; }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid var(--border);
        background: #20242d;
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        transition: background .15s ease, border-color .15s ease;
      }
      button:hover { background: #272c37; }
      button:disabled { opacity: .55; cursor: default; }
      .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .plans button { background: var(--accent); border-color: transparent; color: #0b0d11; font-weight: 600; }
      .plans button:hover { background: var(--accent-hover); }
      .actions { display: flex; gap: 8px; margin-top: 16px; }
      .actions button { flex: 1; }
      .muted-btn { background: transparent; }
      #status { margin-top: 16px; font-size: 13px; min-height: 18px; }
      #status.error { color: var(--danger); }
      #status.ok { color: var(--ok); }
      #status.info { color: var(--muted); }
      #clerk-signin { display: flex; justify-content: center; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>rbox</h1>
      <p class="sub">Account &amp; billing dashboard</p>

      <!-- Signed-out: Clerk SignIn mounts here -->
      <div id="signed-out" class="hidden">
        <div id="clerk-signin"></div>
      </div>

      <!-- Signed-in dashboard -->
      <div id="signed-in" class="hidden">
        <div class="row"><span class="k">Account</span><span class="v" id="account-id">—</span></div>
        <div class="row"><span class="k">Plan</span><span class="v" id="plan">—</span></div>

        <div class="section-title">Storage</div>
        <div class="bar"><span id="usage-bar"></span></div>
        <div class="row"><span class="k">Used</span><span class="v" id="used">—</span></div>
        <div class="row"><span class="k">Workspaces</span><span class="v" id="workspaces">—</span></div>
        <div class="row"><span class="k">Version history</span><span class="v" id="retention">—</span></div>

        <div class="section-title">Subscribe</div>
        <div class="plans">
          <button data-plan="solo">Solo</button>
          <button data-plan="pro">Pro</button>
          <button data-plan="team">Team</button>
        </div>

        <div class="actions">
          <button id="manage-billing" class="muted-btn">Manage billing</button>
          <button id="sign-out" class="muted-btn">Sign out</button>
        </div>
      </div>

      <div id="status" class="info">Loading…</div>
    </div>

    <script src="./config.js"></script>
    <!-- ClerkJS via CDN. The publishable key + frontend API host are read by ClerkJS
         from the data-clerk-publishable-key attribute (host is derived from the pk). -->
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_Y2VydGFpbi1yYXktMzMuY2xlcmsuYWNjb3VudHMuZGV2JA"
      src="https://certain-ray-33.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
