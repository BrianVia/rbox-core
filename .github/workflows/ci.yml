# PR/main CI — the merge and release gate. The release workflow requires a
# successful run for the exact tagged SHA from a push to main (design 150), so it
# does not duplicate this suite before signing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch/PR — a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub-hosted only (founder decision 2026-07-13): the self-hosted home box
  # double-booked as the dev workstation — CPU-starved runners flaked heavyweight
  # tests every busy run, and ephemeral job workspaces leaked ~13GB/day/container
  # (filled a 916GB disk once). Not worth it.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "tests · shard 1/6"
            kind: src
            shard_index: 0
            shard_count: 6
          - name: "tests · shard 2/6"
            kind: src
            shard_index: 1
            shard_count: 6
          - name: "tests · shard 3/6"
            kind: src
            shard_index: 2
            shard_count: 6
          - name: "tests · shard 4/6"
            kind: src
            shard_index: 3
            shard_count: 6
          - name: "tests · shard 5/6"
            kind: src
            shard_index: 4
            shard_count: 6
          - name: "tests · shard 6/6"
            kind: src
            shard_index: 5
            shard_count: 6
          - name: "typecheck · guards · storage truth"
            kind: checks
          - name: "workers API · shard 1/2"
            kind: workers-api
            shard_index: 1
            shard_count: 2
          - name: "workers API · shard 2/2"
            kind: workers-api
            shard_index: 2
            shard_count: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # `bun run typecheck` shells out to `tsc`, whose node shebang otherwise picks
      # up the self-hosted runner image's ancient system Node (v10, no `??`). Pin a
      # modern Node on PATH so tsc runs the same here as on GitHub-hosted runners.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: matrix.kind != 'src'
        with:
          node-version: 24

      # Cache Bun's global package store (setup-bun caches only the bun binary),
      # keyed on the lockfile hash + --frozen-lockfile so versions come solely from
      # bun.lock (sha512-integrity-verified).
      - name: Cache bun install store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Cache tsc incremental state
        if: matrix.kind == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'apps/api/tsconfig.json', 'package.json', 'bun.lock', 'src/**/*.ts', 'apps/api/src/**/*.ts', 'apps/api/tail/src/**/*.ts') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      - name: Cache apps/api vitest artifacts
        if: matrix.kind == 'workers-api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vitest/apps-api
          key: vitest-api-${{ matrix.shard_index }}-${{ runner.os }}-${{ hashFiles('apps/api/vitest.config.ts', 'apps/api/wrangler.jsonc', 'apps/api/src/**/*.ts', 'apps/api/test/**/*.ts', 'apps/api/migrations/**/*.sql', 'package.json', 'bun.lock') }}
          restore-keys: |
            vitest-api-${{ matrix.shard_index }}-${{ runner.os }}-

      # Host-platform install (Linux): pulls @parcel/watcher-linux-x64-glibc so the
      # native watcher suite RUNS here (must not silently skip on CI — design §41).
      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Guards
        if: matrix.kind == 'checks'
        run: bun run guards

      - name: Typecheck (root + apps/api)
        if: matrix.kind == 'checks'
        run: bun run typecheck

      - name: Test — src shard
        if: matrix.kind == 'src'
        run: bun scripts/ci-shard-tests.ts run --shard-count "${{ matrix.shard_count }}" --shard-index "${{ matrix.shard_index }}"

      - name: Test — apps/api (Workers shard ${{ matrix.shard_index }}/${{ matrix.shard_count }})
        if: matrix.kind == 'workers-api'
        run: cd apps/api && npx vitest run --shard=${{ matrix.shard_index }}/${{ matrix.shard_count }}

      - name: Test — storage truth runner
        if: matrix.kind == 'checks'
        run: bun run test:storage-truth

  bun-refwatch-contract:
    name: "bun · refwatch behavior contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install (frozen, all platforms)
        # --os=*/--cpu=* mirrors the release legs: the probe self-compiles, and
        # bun's bundler must resolve ALL THREE literal @parcel/watcher platform
        # requires — a host-filtered install leaves two missing and the compile
        # step fails (maiden-run lesson, PR #383).
        run: bun install --frozen-lockfile --os=* --cpu=*
      - name: Run Bun ref-watch contract from source
        run: bun scripts/probe/bun-refwatch-contract.ts

  web:
    name: "web · check + build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect apps/web changes
        id: web-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- apps/web/; then
              CHANGED=false
            else
              CHANGED=true
            fi
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git diff-tree --quiet --root -r "$HEAD_SHA" -- apps/web/; then
              CHANGED=false
            else
              CHANGED=true
            fi
          elif git diff --quiet "$PUSH_BEFORE_SHA" "$HEAD_SHA" -- apps/web/; then
            CHANGED=false
          else
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "apps/web changed: $CHANGED"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.web-changes.outputs.changed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Match Cloudflare npm
        if: steps.web-changes.outputs.changed == 'true'
        run: npm install --global npm@10.9.2

      - name: Install web dependencies
        if: steps.web-changes.outputs.changed == 'true'
        working-directory: apps/web
        run: npm ci

      - name: Check web
        if: steps.web-changes.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run check

      - name: Build web
        if: steps.web-changes.outputs.changed == 'true'
        working-directory: apps/web
        run: npm run build

  regress-flows:
    name: "ux · regress flows"
    needs: compiled-tui-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Detect regress flow changes
        id: regress-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$HEAD_SHA")"
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- src/ scripts/ux/ scripts/rig/; then
              CHANGED=false
            else
              CHANGED=true
            fi
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if git diff-tree --quiet --root -r "$HEAD_SHA" -- src/ scripts/ux/ scripts/rig/; then
              CHANGED=false
            else
              CHANGED=true
            fi
          elif git diff --quiet "$PUSH_BEFORE_SHA" "$HEAD_SHA" -- src/ scripts/ux/ scripts/rig/; then
            CHANGED=false
          else
            CHANGED=true
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "regress flow inputs changed: $CHANGED"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.regress-changes.outputs.changed == 'true'
        with:
          bun-version: "1.3.14"

      - name: Cache bun install store
        if: steps.regress-changes.outputs.changed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install (frozen)
        if: steps.regress-changes.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Download compiled CLI
        if: steps.regress-changes.outputs.changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-tui-dist
          path: dist

      - name: Regress flows against compiled CLI
        if: steps.regress-changes.outputs.changed == 'true'
        env:
          RBOX_DEV_BOOTSTRAP: ${{ secrets.RBOX_DEV_BOOTSTRAP }}
          RBOX_UX_BINARY: ${{ github.workspace }}/dist/rbox-linux-x64
        run: |
          if [ -z "$RBOX_DEV_BOOTSTRAP" ]; then
            echo "::error::RBOX_DEV_BOOTSTRAP repo secret is required for the compiled UX gate"
            exit 1
          fi
          chmod +x "$RBOX_UX_BINARY"
          bun scripts/ux/regress.ts

  compiled-tui-build:
    name: "compiled TUI · cross-build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install (frozen, all platforms)
        run: bun install --frozen-lockfile --os=* --cpu=*
      - name: Cross-build all release targets
        run: bun scripts/release.ts --dev --targets=darwin-arm64,linux-x64,linux-arm64
      - name: Upload exact candidate binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbox-tui-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  compiled-tui:
    name: "compiled TUI · ${{ matrix.target }}"
    needs: compiled-tui-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # GH-hosted Linux runners intermittently report Ctrl-C deaths as status 0
    # even with a proven-live input pipeline (REVIEW-185 round 6 addendum);
    # darwin, local Linux, and real kill -INT all give the contracted 130. The
    # smoke demotes ONLY the numeric status comparison to a warning under this
    # env — pane death and every echo/sentinel assertion still gate.
    env:
      RBOX_TUI_SMOKE_STATUS_ADVISORY: ${{ startsWith(matrix.os, 'ubuntu-') && '1' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Download exact candidate binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-tui-dist
          path: dist
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update
              sudo apt-get install -y tmux
            fi
          fi
      - name: Exercise full prompt chain
        run: |
          chmod +x "$GITHUB_WORKSPACE/dist/rbox-${{ matrix.target }}"
          bun run tui-smoke "$GITHUB_WORKSPACE/dist/rbox-${{ matrix.target }}"
      - name: Exercise Ctrl-C cleanup
        run: bun run tui-smoke "$GITHUB_WORKSPACE/dist/rbox-${{ matrix.target }}" --cancel
      - name: Exercise secret failure matrix
        run: |
          bin="$GITHUB_WORKSPACE/dist/rbox-${{ matrix.target }}"
          bun run tui-smoke "$bin" --secret-retry
          bun run tui-smoke "$bin" --secret-abort
          bun run tui-smoke "$bin" --secret-render-error
          bun run tui-smoke "$bin" --secret-cancel

  compiled-tui-performance:
    name: "compiled TUI · startup/size budget"
    needs: compiled-tui-build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: baseline
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Download exact candidate binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-tui-dist
          path: dist
      - name: Build baseline with the baseline release script
        working-directory: baseline
        run: |
          bun install --frozen-lockfile --os=* --cpu=*
          bun scripts/release.ts --dev --targets=darwin-arm64
      - name: Enforce startup, RSS, and binary-size budgets
        run: |
          chmod +x "$GITHUB_WORKSPACE/baseline/dist/rbox-darwin-arm64" "$GITHUB_WORKSPACE/dist/rbox-darwin-arm64"
          bun run tui-budget "$GITHUB_WORKSPACE/baseline/dist/rbox-darwin-arm64" "$GITHUB_WORKSPACE/dist/rbox-darwin-arm64"

  compiled-onboarding-rig:
    name: "compiled TUI · onboarding rig"
    needs: compiled-tui-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RBOX_DEV_BOOTSTRAP: ${{ secrets.RBOX_DEV_BOOTSTRAP }}
      RBOX_DEV_PLATFORM_SECRET: ${{ secrets.RBOX_DEV_PLATFORM_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Download exact candidate binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-tui-dist
          path: dist
      - name: Run two-machine onboarding against compiled CLI
        run: |
          if [ -z "$RBOX_DEV_BOOTSTRAP" ] || [ -z "$RBOX_DEV_PLATFORM_SECRET" ]; then
            echo "::error::RBOX_DEV_BOOTSTRAP and RBOX_DEV_PLATFORM_SECRET repo secrets are required for the compiled onboarding gate"
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/dist/rbox-linux-x64"
          bun run rig run onboard-smoke --runner docker --binary "$GITHUB_WORKSPACE/dist/rbox-linux-x64"
      - name: Tear down rig
        if: always()
        run: bun run rig down --runner docker
