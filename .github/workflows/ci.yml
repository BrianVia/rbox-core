# PR CI — the merge gate. Runs the same test+typecheck the release build runs
# (design 14), PLUS the apps/api Worker suite the release build skips, on every PR
# and on main. Catches regressions BEFORE merge, not at release time.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch/PR — a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub-hosted only (founder decision 2026-07-13): the self-hosted home box
  # double-booked as the dev workstation — CPU-starved runners flaked heavyweight
  # tests every busy run, and ephemeral job workspaces leaked ~13GB/day/container
  # (filled a 916GB disk once). Not worth it.
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "tests · shard 1/6"
            kind: src
            shard_index: 0
            shard_count: 6
          - name: "tests · shard 2/6"
            kind: src
            shard_index: 1
            shard_count: 6
          - name: "tests · shard 3/6"
            kind: src
            shard_index: 2
            shard_count: 6
          - name: "tests · shard 4/6"
            kind: src
            shard_index: 3
            shard_count: 6
          - name: "tests · shard 5/6"
            kind: src
            shard_index: 4
            shard_count: 6
          - name: "tests · shard 6/6"
            kind: src
            shard_index: 5
            shard_count: 6
          - name: "typecheck · guards · workers API"
            kind: checks-api
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      # `bun run typecheck` shells out to `tsc`, whose node shebang otherwise picks
      # up the self-hosted runner image's ancient system Node (v10, no `??`). Pin a
      # modern Node on PATH so tsc runs the same here as on GitHub-hosted runners.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Cache Bun's global package store (setup-bun caches only the bun binary),
      # keyed on the lockfile hash + --frozen-lockfile so versions come solely from
      # bun.lock (sha512-integrity-verified).
      - name: Cache bun install store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Cache tsc incremental state
        if: matrix.kind == 'checks-api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'apps/api/tsconfig.json', 'package.json', 'bun.lock', 'src/**/*.ts', 'apps/api/src/**/*.ts', 'apps/api/tail/src/**/*.ts') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      - name: Cache apps/api vitest artifacts
        if: matrix.kind == 'checks-api'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vitest/apps-api
          key: vitest-api-${{ runner.os }}-${{ hashFiles('apps/api/vitest.config.ts', 'apps/api/wrangler.jsonc', 'apps/api/src/**/*.ts', 'apps/api/test/**/*.ts', 'apps/api/migrations/**/*.sql', 'package.json', 'bun.lock') }}
          restore-keys: |
            vitest-api-${{ runner.os }}-

      # Host-platform install (Linux): pulls @parcel/watcher-linux-x64-glibc so the
      # native watcher suite RUNS here (must not silently skip on CI — design §41).
      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Guard — src test shard coverage
        if: matrix.kind == 'src' && matrix.shard_index == 0
        run: bun scripts/ci-shard-tests.ts guard --shard-count "${{ matrix.shard_count }}"

      # The whole CLI's STDERR + Ctrl-C prompt invariants rest on `@inquirer` being
      # imported from ONE file (src/cli/prompt.ts). A stray import elsewhere could
      # miss the stderr `output` and silently pollute stdout — guard it structurally.
      - name: Guard — only prompt.ts imports @inquirer
        if: matrix.kind == 'checks-api'
        run: |
          if grep -rn 'from "@inquirer' src/ | grep -v '^src/cli/prompt.ts:'; then
            echo "::error::@inquirer may only be imported from src/cli/prompt.ts (STDERR + Ctrl-C invariant)"
            exit 1
          fi

      - name: Typecheck (root + apps/api)
        if: matrix.kind == 'checks-api'
        run: bun run typecheck

      - name: Test — src shard
        if: matrix.kind == 'src'
        run: bun scripts/ci-shard-tests.ts run --shard-count "${{ matrix.shard_count }}" --shard-index "${{ matrix.shard_index }}"

      - name: Test — apps/api (Workers)
        if: matrix.kind == 'checks-api'
        run: cd apps/api && npx vitest run

      - name: Test — storage truth runner
        if: matrix.kind == 'checks-api'
        run: bun run test:storage-truth
