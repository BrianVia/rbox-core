# PR CI — the merge gate. Runs the same test+typecheck the release build runs
# (design 14), PLUS the apps/api Worker suite the release build skips, on every PR
# and on main. Catches regressions BEFORE merge, not at release time.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per branch/PR — a new push cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.3.5"

      # Cache Bun's global package store (setup-bun caches only the bun binary),
      # keyed on the lockfile hash + --frozen-lockfile so versions come solely from
      # bun.lock (sha512-integrity-verified). Shares the non-superset namespace with
      # deploy-api.yml, so a warm cache is reused across workflows.
      - name: Cache bun install store
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # Host-platform install (Linux): pulls @parcel/watcher-linux-x64-glibc so the
      # native watcher suite RUNS here (must not silently skip on CI — design §41).
      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Typecheck (root + apps/api)
        run: |
          npx tsc --noEmit
          (cd apps/api && npx tsc -p . --noEmit)

      - name: Test — CLI + engine
        run: bun test ./src/

      - name: Test — apps/api (Workers)
        run: cd apps/api && npx vitest run
