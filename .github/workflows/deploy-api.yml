# Auto-deploy the worker to PRODUCTION (rbox-prod-api / api.rbox.to) on pushes
# to production that touch apps/api. Gated on typecheck + the Workers API tests
# so a broken change cannot migrate or deploy prod. See docs/DEPLOYMENTS.md.
#
# Requires repo secret CLOUDFLARE_DEPLOY_TOKEN — the token needs Workers
# Scripts:Edit + D1:Edit + Account:Read for the account hard-coded below. This
# is DISTINCT from release.yml's R2-only CLOUDFLARE_API_TOKEN.
name: Deploy API (prod)

on:
  push:
    branches: [production]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: d1d5680013391ca21665add23eee6426
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "latest"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # setup-bun caches only the Bun binary. The frozen install keeps restored
      # package data subordinate to the integrity-verified bun.lock resolution.
      - name: Cache bun install store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Cache tsc incremental state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'apps/api/tsconfig.json', 'package.json', 'bun.lock', 'src/**/*.ts', 'apps/api/src/**/*.ts', 'apps/api/tail/src/**/*.ts') }}
          restore-keys: |
            tsc-${{ runner.os }}-

      - name: Cache apps/api vitest artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vitest/apps-api
          key: vitest-api-${{ runner.os }}-${{ hashFiles('apps/api/vitest.config.ts', 'apps/api/wrangler.jsonc', 'apps/api/src/**/*.ts', 'apps/api/test/**/*.ts', 'apps/api/migrations/**/*.sql', 'package.json', 'bun.lock') }}
          restore-keys: |
            vitest-api-${{ runner.os }}-

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Gate — typecheck + Workers API tests
        run: |
          bun run typecheck
          bun run test:api

      - name: Apply production D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler d1 migrations apply rbox-prod-db --remote --env production

      - name: Deploy rbox-prod-api
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler deploy --env production

      - name: Upload production version
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
        run: npx wrangler versions upload --env production
