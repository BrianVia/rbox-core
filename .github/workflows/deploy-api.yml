# Auto-deploy the worker to PRODUCTION (rbox-prod-api / api.rbox.to) on pushes to
# main that touch apps/api. Gated on typecheck + the Miniflare worker tests so a
# broken change can't reach prod. See AGENTS.md "Deployment & local dev".
#
# Requires repo secret CLOUDFLARE_DEPLOY_TOKEN — a token scoped to
# Workers Scripts:Edit (+ Account:Read) for this account. This is DISTINCT from
# release.yml's R2-only CLOUDFLARE_API_TOKEN (keep least privilege).
name: Deploy API (prod)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, flatmeadow]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - name: Gate — typecheck (root + api) + worker tests, in parallel
        # These three are independent: the two `tsc --noEmit` projects write nothing
        # to disk and the Miniflare vitest run is isolated, so run them concurrently
        # and fail if any fails. On a multi-core runner this collapses the gate from
        # ~sum (~25s on 2 vCPU) toward the slowest single unit.
        run: |
          set -uo pipefail
          pids=()
          bun x tsc --noEmit                 & pids+=($!)
          bun x tsc -p apps/api --noEmit     & pids+=($!)
          (cd apps/api && bun x vitest run)  & pids+=($!)
          rc=0
          for p in "${pids[@]}"; do wait "$p" || rc=1; done
          exit $rc
      - name: Deploy to rbox-prod-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: d1d5680013391ca21665add23eee6426
          workingDirectory: apps/api
          command: deploy --env production
