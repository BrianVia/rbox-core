# TEMPORARY — root-cause harness for #827. Deleted before this branch merges.
name: debug-827

on:
  workflow_dispatch:
  push:
    branches: [debug-827]

permissions:
  contents: read

jobs:
  probe:
    name: "debug-827 · nscloud probe"
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "latest"

      - name: Runner and docker facts
        run: |
          set -x
          id
          pwd
          pwd -P
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          readlink -f "$GITHUB_WORKSPACE"
          ls -ld /home/runner /home/runner/work "$GITHUB_WORKSPACE" || true
          mount | grep -Ei 'runner|work|nsc' || true
          which docker; type docker; docker --version
          docker info || true
          docker context ls || true
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker ps -a
          docker version --format '{{json .}}' || true

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Create one UX container directly
        continue-on-error: true
        env:
          UX_DEBUG_OWNERSHIP: "1"
        run: bun scripts/ux/fresh-machine.ts create --run-id dbg1 --name a

      - name: Inspect what the daemon actually recorded
        continue-on-error: true
        run: |
          docker ps -a
          docker inspect ux-dbg1

      - name: Build the linux CLI the CI regress job would consume
        run: bun scripts/release.ts --dev --targets=linux-x64

      - name: Regress every flow (CI configuration)
        env:
          UX_DEBUG_OWNERSHIP: "1"
          RBOX_DEV_BOOTSTRAP: ${{ secrets.RBOX_DEV_BOOTSTRAP }}
          RBOX_UX_BINARY: ${{ github.workspace }}/dist/rbox-linux-x64
        run: |
          chmod +x "$RBOX_UX_BINARY"
          bun scripts/ux/regress.ts

      - name: Flow artifacts
        continue-on-error: true
        run: for f in scripts/ux/runs/*/*.json; do echo "== $f"; cat "$f"; done

      - name: Clean up
        if: always()
        run: |
          docker rm -f $(docker ps -aq --filter label=ux=1) || true
