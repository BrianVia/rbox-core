# Auto-deploy the dashboard to the rbox-app Pages project (app.rbox.to) on pushes
# to main that touch apps/web. Gated on svelte-check + unit tests, then builds the
# static SPA and uploads it. See AGENTS.md "Deployment & local dev".
#
# apps/web is its own npm project (not the bun root). Uses CLOUDFLARE_DEPLOY_TOKEN
# (Cloudflare Pages:Edit + Account:Read).
name: Deploy dashboard (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm install (not ci): Clerk's optional native deps (utf-8-validate/bufferutil
      # via ws) make a macOS-generated lock fail strict `npm ci` on Linux. install
      # still respects the lock for the rest.
      - run: npm install --no-audit --no-fund
      - name: Gate — types + unit tests, then build
        run: |
          npm run check
          npm run test
          npm run build
      - name: Deploy build/ to rbox-app
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: d1d5680013391ca21665add23eee6426
          workingDirectory: apps/web
          command: pages deploy build --project-name rbox-app --branch main
