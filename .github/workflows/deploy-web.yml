# Auto-deploy the dashboard to the rbox-app Pages project (app.rbox.to) on pushes
# to main that touch apps/web. Gated on svelte-check + unit tests, then builds the
# static SPA and uploads it. See AGENTS.md "Deployment & local dev".
#
# apps/web is its own npm project (not the bun root). Uses CLOUDFLARE_DEPLOY_TOKEN
# (Cloudflare Pages:Edit + Account:Read).
name: Deploy dashboard (Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  # Route to the self-hosted "home" box when online, else fall back to GitHub-hosted.
  # Runs on ubuntu-latest so the decision is available even when the box is off.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.choose.outputs.runner }}
    steps:
      - id: choose
        env:
          GH_TOKEN: ${{ secrets.RUNNER_ADMIN_PAT }}
        run: |
          online=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | select(.status=="online" and ([.labels[].name] | index("self-hosted-home")))] | length')
          if [ "${online:-0}" -gt 0 ]; then
            echo "runner=self-hosted-home" >> "$GITHUB_OUTPUT"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm install (not ci): Clerk's optional native deps (utf-8-validate/bufferutil
      # via ws) make a macOS-generated lock fail strict `npm ci` on Linux. install
      # still respects the lock for the rest.
      - run: npm install --no-audit --no-fund

      # SvelteKit's generated .svelte-kit dir + Vite's dep pre-bundle cache. Just a
      # build-speed optimization (svelte-check/vite still re-validate content), so a
      # stale restore-key fallback is safe here — unlike release.yml's signing path.
      - name: Cache SvelteKit + Vite build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/web/.svelte-kit
            apps/web/node_modules/.vite
          key: sveltekit-vite-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            sveltekit-vite-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}-
            sveltekit-vite-${{ runner.os }}-
      - name: Gate — types + unit tests, then build
        run: |
          npm run check
          npm run test
          npm run build
      - name: Deploy build/ to rbox-app
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          accountId: d1d5680013391ca21665add23eee6426
          workingDirectory: apps/web
          command: pages deploy build --project-name rbox-app --branch main
