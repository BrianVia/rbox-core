# e2e — the design-56 rig on a SELF-HOSTED runner (design 56 §11).
#
# ⚠️  NO SELF-HOSTED RUNNER IS REGISTERED YET. This workflow is deliberate
# scaffolding: it targets `[self-hosted, macOS, ARM64]` because GitHub-hosted
# runners cannot do macOS 26 + vmnet (Apple `container` needs container-to-container
# networking, which GitHub's hosted macOS images do not provide — design 56 §11).
# Until the founder registers a runner on the M2 Max, every job here QUEUES/skips.
# That is expected — merging this does not turn anything on.
#
# Before the runner goes live, set these repo secrets:
#   - RBOX_DEV_BOOTSTRAP        (required)  — the dev bootstrap secret the rig injects
#                                             by env (never argv); mirrors dev-keys.local.secret.
#   - CLOUDFLARE_ACCOUNT_ID     (optional)  — enables the after-the-fact AE SQL query
#   - CLOUDFLARE_API_TOKEN      (optional)  — "  (both skip-tolerant; absence only drops
#                                             the server-metrics capture channel)
#
# This lane NEVER touches prod: the rig refuses any prod API URL before a container
# starts (config.assertNotProd), and the runner points only at the dev worker.
name: e2e

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (a name, or `all` for the FAST suite)"
        required: false
        default: "all"
  schedule:
    # 09:00 UTC ≈ 02:00 America/Los_Angeles (San Diego), give or take DST. Nightly.
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  rig:
    # Only fork-clean: never let a fork's scheduled run try to grab the founder's
    # self-hosted runner + dev secrets (design 56 §15 — self-hosted runner posture).
    if: github.repository == 'BrianVia/rbox-core'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    env:
      RBOX_DEV_BOOTSTRAP: ${{ secrets.RBOX_DEV_BOOTSTRAP }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      # The self-hosted runner already has bun + Apple `container` (rig doctor asserts
      # both). Frozen install so versions come solely from bun.lock.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Host preflight — macOS >= 26, container present + healthy, bootstrap secret
      # resolvable, dev API reachable. A red doctor MUST fail the job (a broken host is
      # not a passing run).
      - name: rig doctor
        run: bun scripts/rig/rig.ts doctor

      # Input reaches the shell via env, never string-interpolated into `run:`
      # (standard injection-proofing, even though dispatch is collaborator-only).
      - name: rig run
        env:
          RIG_SCENARIO: ${{ inputs.scenario || 'all' }}
        run: bun scripts/rig/rig.ts run "$RIG_SCENARIO"

      # Always publish the run dirs (logs, metrics, stats, report.md/json) — the
      # artifact is the whole point of a headless nightly.
      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rig-runs-${{ github.run_id }}
          path: scripts/rig/runs/
          if-no-files-found: ignore

      # Always tear down: stop+delete rig-* containers + the network so the runner is
      # clean for the next job (containers reused across scenarios within a run; torn
      # down between jobs).
      - name: rig down
        if: always()
        run: bun scripts/rig/rig.ts down
