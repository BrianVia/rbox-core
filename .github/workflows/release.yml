# Release pipeline (design 14/150): on a `v*` tag, require exact-SHA main CI,
# build the 3 standalone binaries,
# sign the version manifest, and publish to the rbox-releases R2 bucket.
#
# REPO SETUP (done — see docs/cicd-release-setup.md):
#   - `v*` tags are protected (ruleset: no deletion / no force-update) so a tag
#     can't be silently re-pointed to re-trigger a release.
#   - The `release` Environment holds the secrets. NOTE: required-reviewer
#     protection is a paid-plan feature and is NOT available on this private repo,
#     so there is NO manual-approval gate — the practical gate is that only the
#     owner can push `v*` tags (which is the only trigger). Treat the signing key
#     as live in GitHub, not behind an approval wall.
#   - Secrets (all on the `release` env): RBOX_RELEASE_PRIVATE_KEY (set),
#     RBOX_RELEASE_KEY_ID (set), CLOUDFLARE_ACCOUNT_ID (set), and
#     CLOUDFLARE_API_TOKEN (scoped to WRITE rbox-releases ONLY — set this last).
#   - SECURITY: third-party actions are pinned to full commit SHAs (tag refs are
#     mutable); the version in the trailing comment is for humans. Re-verify the
#     SHA when bumping the comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

# Only one workflow may mutate the live release objects at a time. A lower
# version is also rejected against the live manifest by scripts/release.ts.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # 1) BUILD — cross-compile + sign all 3 binaries (darwin-arm64, linux-x64, linux-arm64)
  #    on one host, but DO NOT upload. Each embeds its own native @parcel/watcher.node
  #    (release.ts asserts presence). Intel Macs (darwin-x64) are not a release target.
  build:
    runs-on: ubuntu-latest
    environment: release # scopes the signing secret to this env (no reviewer gate on free plan)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14" # release builds cross-compile: canary publishes no cross-target blobs

      - name: Version consistency (tag == package.json == embedded RBOX_VERSION)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          EMB="$(node -p "require('fs').readFileSync('src/cli/version.ts','utf8').match(/\"([^\"]+)\"/)[1]")"
          echo "tag=$TAG pkg=$PKG embedded=$EMB"
          test "$TAG" = "$PKG" || { echo "::error::git tag ($TAG) != package.json ($PKG)"; exit 1; }
          test "$TAG" = "$EMB" || { echo "::error::git tag ($TAG) != src/cli/version.ts ($EMB)"; exit 1; }

      # The tag may be pushed with main, so wait for CI's exact post-squash/main
      # commit verdict. PR merge-preview SHAs and tree-equivalent commits do not qualify.
      - name: Gate — exact tagged SHA passed main CI
        timeout-minutes: 11
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/wait-for-main-ci.ts

      - name: Install (frozen, all platforms)
        # `--os=* --cpu=*` force-installs every @parcel/watcher-<platform> package so this
        # single Ubuntu host can cross-compile all 3 targets and embed each one's native
        # binding (design §41 §6). Without it, bun os/cpu-filters and the darwin build
        # would silently ship without the live watcher.
        run: bun install --frozen-lockfile --os=* --cpu=*

      - name: Build + sign (no upload)
        env:
          RBOX_RELEASE_PRIVATE_KEY: ${{ secrets.RBOX_RELEASE_PRIVATE_KEY }}
          RBOX_RELEASE_KEY_ID: ${{ secrets.RBOX_RELEASE_KEY_ID }}
        run: bun scripts/release.ts "${GITHUB_REF_NAME#v}" --no-upload

      - name: Compile Linux Bun ref-watch contract probes
        run: |
          bun build --compile --target=bun-linux-x64 scripts/probe/bun-refwatch-contract.ts --outfile dist/bun-refwatch-contract-linux-x64
          bun build --compile --target=bun-linux-arm64 scripts/probe/bun-refwatch-contract.ts --outfile dist/bun-refwatch-contract-linux-arm64

      - name: Upload built + signed dist as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbox-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # 2) SMOKE — one NATIVE runner per target. Run THAT target's compiled release binary and
  #    prove the native @parcel/watcher loads + delivers a real fs event (design §41 §6).
  #    Any leg failing blocks the release — a target that can't load its watcher never ships.
  smoke:
    needs: build
    strategy:
      fail-fast: false # run every target so we see all results, not just the first failure
      matrix:
        include:
          - target: darwin-arm64
            os: macos-14
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14" # release builds cross-compile: canary publishes no cross-target blobs
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-dist
          path: dist
      - name: Smoke the native watcher (${{ matrix.target }} on ${{ matrix.os }})
        # The compiled binary's own exit code gates the step: 0 = watcher loaded + event
        # delivered + memory bounded; non-zero = fail. It also prints a WATCHER_SELFTEST line.
        run: |
          bin="dist/rbox-${{ matrix.target }}"
          chmod +x "$bin"
          "$bin" __watcher-selftest
      - name: Install tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install tmux
            else
              sudo apt-get update
              sudo apt-get install -y tmux
            fi
          fi
      - name: Exercise compiled TUI success and Ctrl-C
        env:
          # GH Linux runners misreport Ctrl-C death statuses (REVIEW-185 round
          # 6 addendum): only the numeric status comparison is advisory there;
          # pane death and echo/sentinel assertions still gate the release.
          RBOX_TUI_SMOKE_STATUS_ADVISORY: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          bin="$GITHUB_WORKSPACE/dist/rbox-${{ matrix.target }}"
          bun run tui-smoke "$bin"
          bun run tui-smoke "$bin" --cancel
          bun run tui-smoke "$bin" --secret-retry
          bun run tui-smoke "$bin" --secret-abort
          bun run tui-smoke "$bin" --secret-render-error
          bun run tui-smoke "$bin" --secret-cancel
      - name: Run compiled Linux Bun ref-watch contract (${{ matrix.target }})
        if: startsWith(matrix.target, 'linux-')
        run: |
          probe="dist/bun-refwatch-contract-${{ matrix.target }}"
          chmod +x "$probe"
          RBOX_REFWATCH_PROBE_COMPILED_CHILD=1 "$probe"
      - name: Assert zero Darwin side-channel handles
        if: startsWith(matrix.target, 'darwin-')
        run: dist/rbox-${{ matrix.target }} __git-refwatch-platform-selftest

  # 3) PUBLISH — gated on ALL smoke legs. Upload the EXACT built+signed+smoked bytes to R2
  #    (release.ts --upload-only re-verifies each binary's sha against the signed manifest).
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: release
    # contents: write ONLY for the GitHub Release step below; R2 publication
    # and signing are untouched by this grant.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14" # release builds cross-compile: canary publishes no cross-target blobs
      - name: Install (frozen, all platforms)
        run: bun install --frozen-lockfile --os=* --cpu=*
      - name: Download built + signed dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rbox-dist
          path: dist
      - name: Version consistency (tag == package.json)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "::error::git tag ($TAG) != package.json ($PKG)"; exit 1; }
      - name: Publish smoke-tested artifacts to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/release.ts "${GITHUB_REF_NAME#v}" --upload-only
      - name: GitHub Release (notes + binaries)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES=/tmp/release-notes.md
          if [[ "$TAG" == *-* ]]; then
            FLAGS=(--prerelease)
            printf 'Prerelease on the opt-in `next` channel.\n\nInstall: `curl -fsSL https://rbox.to/next/install.sh | sh` or `rbox upgrade --channel next`.\n' > "$NOTES"
          else
            FLAGS=()
            # Extract this version's CHANGELOG section (between its heading and the next one).
            awk -v ver="${TAG#v}" 'BEGIN{on=0} /^## \[/{ if (on) exit; if (index($0, "[" ver "]")) { on=1; next } } on' CHANGELOG.md > "$NOTES"
            test -s "$NOTES" || { echo "::error::CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/rbox-* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" "${FLAGS[@]}" dist/rbox-*
          fi
      - name: Rebuild the public changelog page
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RBOX_HOME_DEPLOY_HOOK: ${{ secrets.RBOX_HOME_DEPLOY_HOOK }}
        run: |
          test -n "$RBOX_HOME_DEPLOY_HOOK" || { echo "::error::RBOX_HOME_DEPLOY_HOOK is not configured"; exit 1; }
          curl --fail --silent --show-error --max-time 15 --request POST "$RBOX_HOME_DEPLOY_HOOK" >/dev/null
