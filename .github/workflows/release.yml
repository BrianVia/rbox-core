# Release pipeline (design 14): on a `v*` tag, build the 4 standalone binaries,
# sign the version manifest, and publish to the rbox-releases R2 bucket.
#
# ONE-TIME REPO SETUP (NOT in this file — design 14 U2/U9):
#   - Protect the `v*` tags (Settings → Tags → protection rule).
#   - Create a `release` Environment with REQUIRED REVIEWERS (manual approval gate)
#     and attach the secrets below to it.
#   - Secrets: RBOX_RELEASE_PRIVATE_KEY (Ed25519 pkcs8 b64url), RBOX_RELEASE_KEY_ID,
#     CLOUDFLARE_API_TOKEN (scoped to WRITE rbox-releases ONLY), CLOUDFLARE_ACCOUNT_ID.
#   - SECURITY: third-party actions are pinned to full commit SHAs (tag refs are
#     mutable); the version in the trailing comment is for humans. Re-verify the
#     SHA when bumping the comment.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release # manual-approval gate; the signing key lives only here
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: "1.3.5"

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Version consistency (tag == package.json == embedded RBOX_VERSION)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          EMB="$(node -p "require('fs').readFileSync('src/cli/version.ts','utf8').match(/\"([^\"]+)\"/)[1]")"
          echo "tag=$TAG pkg=$PKG embedded=$EMB"
          test "$TAG" = "$PKG" || { echo "::error::git tag ($TAG) != package.json ($PKG)"; exit 1; }
          test "$TAG" = "$EMB" || { echo "::error::git tag ($TAG) != src/cli/version.ts ($EMB)"; exit 1; }

      - name: Test + typecheck (before we sign anything)
        run: |
          bun test src
          npx tsc --noEmit
          (cd apps/api && npx tsc -p . --noEmit)

      - name: Build, sign, and publish the release
        env:
          RBOX_RELEASE_PRIVATE_KEY: ${{ secrets.RBOX_RELEASE_PRIVATE_KEY }}
          RBOX_RELEASE_KEY_ID: ${{ secrets.RBOX_RELEASE_KEY_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/release.ts "${GITHUB_REF_NAME#v}"
