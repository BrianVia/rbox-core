<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    rbox app icon — "open box in orbit"
    A crisp open carton on a deep blue→indigo squircle,
    wrapped by a broken sync-orbit ring with two arrowheads (continuous E2EE sync).
    Palette echoes the design-88 menu-bar mockup (#0A84FF blue, #3D2B4E indigo-plum).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA2FF"/>
      <stop offset="0.42" stop-color="#0A6BF0"/>
      <stop offset="1" stop-color="#3A2A55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.24" r="0.9">
      <stop offset="0" stop-color="#8ED0FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8ED0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EEFF"/>
    </linearGradient>
    <filter id="boxshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0A1B3D" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- squircle plate -->
  <rect x="80" y="80" width="864" height="864" rx="208" ry="208" fill="url(#bg)"/>
  <rect x="80" y="80" width="864" height="864" rx="208" ry="208" fill="url(#glow)"/>
  <!-- crisp top rim highlight -->
  <rect x="80" y="80" width="864" height="864" rx="208" ry="208" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- sync-orbit ring (behind the box), tilted -->
  <g transform="rotate(-24 512 512)">
    <ellipse cx="512" cy="512" rx="366" ry="300" fill="none"
             stroke="#DCEBFF" stroke-opacity="0.16" stroke-width="26"/>
    <!-- two bright arrowhead arcs -->
    <g fill="none" stroke="#EAF4FF" stroke-opacity="0.72" stroke-width="26" stroke-linecap="round">
      <path d="M 512 212 A 366 300 0 0 1 806 470"/>
      <path d="M 512 812 A 366 300 0 0 1 218 554"/>
    </g>
    <path d="M806 470 l 44 -22 l -52 -20 z" fill="#EAF4FF" fill-opacity="0.9"/>
    <path d="M218 554 l -44 22 l 52 20 z" fill="#EAF4FF" fill-opacity="0.9"/>
  </g>

  <!-- Open carton, matching the menu-bar glyph. -->
  <g filter="url(#boxshadow)" fill="none" stroke="url(#rface)" stroke-width="72"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 350 366 244 212 334 322 450"/>
    <path d="M512 350 658 244 812 334 702 450"/>
    <path d="M322 450v244l190 106 190-106V450"/>
    <path d="M322 450 512 550l190-100"/>
    <path d="M512 550v250" stroke-opacity="0.72"/>
  </g>
</svg>
